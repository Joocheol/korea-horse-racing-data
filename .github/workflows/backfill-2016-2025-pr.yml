name: PR backfill KRA 2016-2025

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

concurrency:
  group: kra-backfill-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONPATH: src

jobs:
  monthly-budget:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/run-backfill-2016-2025'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Guard aggregate monthly-service budgets
        run: |
          python <<'PY'
          import json
          from kra_data.planning import build_monthly_units
          from kra_data.preflight import check_budget

          years = (2016, 2017, 2018, 2019, 2022, 2023, 2024, 2025)
          meets = (1, 2, 3)
          endpoints = (
              "single", "double", "triple", "sales", "entries",
              "race_record", "quinella_crosscheck",
          )
          units = []
          for year in years:
              units.extend(build_monthly_units(year, year, meets, endpoints))
          budgets = check_budget(units)
          report = {
              "years": list(years),
              "units": len(units),
              "budgets": [
                  {
                      "service": item.service,
                      "estimated_calls": item.estimated_calls,
                      "safety_margin": item.safety_margin,
                      "daily_limit": item.daily_limit,
                      "allowed": item.allowed,
                  }
                  for item in budgets
              ],
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          assert all(item.allowed for item in budgets), report
          PY

  phase1:
    needs: monthly-budget
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [2016, 2017, 2018, 2019, 2022, 2023, 2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: kra-collection
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Find prior resumable state
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          YEAR: ${{ matrix.year }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["CURRENT_RUN_ID"])
          year = os.environ["YEAR"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "kra-backfill-resume",
          }

          def artifacts(name):
              encoded = urllib.parse.quote(name)
              url = (
                  f"https://api.github.com/repos/{repository}/actions/artifacts"
                  f"?name={encoded}&per_page=100"
              )
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  payload = json.load(response)
              return [
                  item for item in payload.get("artifacts", [])
                  if not item.get("expired")
                  and int(item.get("workflow_run", {}).get("id", 0)) != current_run
              ]

          selected = None
          for name in (f"kra-backfill-{year}", f"kra-phase1-{year}"):
              candidates = artifacts(name)
              if candidates:
                  selected = max(candidates, key=lambda item: item.get("created_at", ""))
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if selected is None:
                  print("run_id=", file=output)
                  print("artifact_name=", file=output)
                  print("No prior resumable artifact found")
              else:
                  run_id = int(selected["workflow_run"]["id"])
                  print(f"run_id={run_id}", file=output)
                  print(f"artifact_name={selected['name']}", file=output)
                  print(
                      f"Resume from {selected['name']} artifact {selected['id']} "
                      f"(run {run_id}, created {selected['created_at']})"
                  )
          PY

      - name: Download prior resumable state
        if: ${{ steps.previous.outputs.run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.previous.outputs.artifact_name }}
          path: restored
          run-id: ${{ steps.previous.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Restore prior output tree
        if: ${{ steps.previous.outputs.run_id != '' }}
        run: |
          if [ -d restored/output ]; then
            rm -rf output
            mv restored/output output
          else
            echo "Selected artifact has no output directory" >&2
            exit 1
          fi

      - name: Collect monthly sources with resumable retries
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          YEAR: ${{ matrix.year }}
        run: |
          set +e
          status=1
          for attempt in 1 2 3 4 5; do
            echo "Phase 1 year=$YEAR attempt=$attempt/5"
            python -m kra_data.cli \
              --start-year "$YEAR" \
              --end-year "$YEAR" \
              --meets 1,2,3 \
              --endpoints single,double,triple,sales,entries,race_record,quinella_crosscheck \
              --used-json '{}' \
              --output output \
              > "phase1-${YEAR}.json"
            status=$?
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 10))
              echo "Transient collection failure; ledger state is retained. Retry in ${delay}s."
              sleep "$delay"
            fi
          done
          exit "$status"

      - name: Verify monthly phase from ledger
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path
          from kra_data.ledger import Ledger
          from kra_data.planning import build_monthly_units

          year = int(os.environ["YEAR"])
          endpoints = (
              "single", "double", "triple", "sales", "entries",
              "race_record", "quinella_crosscheck",
          )
          expected = build_monthly_units(year, year, (1, 2, 3), endpoints)
          completed = Ledger(Path("output/ledger.json")).completed()
          missing = [unit.key for unit in expected if unit.key not in completed]
          assert len(expected) == 360, len(expected)
          assert not missing, f"{len(missing)} monthly units remain incomplete; first={missing[:5]}"

          report_path = Path(f"phase1-{year}.json")
          if report_path.exists() and report_path.stat().st_size:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              print(json.dumps(report, ensure_ascii=False, indent=2))
          print(f"Monthly ledger complete: {len(expected)}/{len(expected)} units for {year}")
          PY
          python -m kra_data.audit \
            --output output \
            --endpoints single,double,triple,sales,entries,race_record,quinella_crosscheck

      - name: Preserve phase-one state even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kra-phase1-${{ matrix.year }}
          path: |
            output
            phase1-${{ matrix.year }}.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  api227-budget:
    needs: phase1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Restore all monthly states
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: kra-phase1-*
          path: phase1
      - name: Discover all API227 dates and guard the aggregate daily budget
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          from kra_data.planning import build_result_units, discover_result_dates
          from kra_data.preflight import check_budget

          years = (2016, 2017, 2018, 2019, 2022, 2023, 2024, 2025)
          meets = (1, 2, 3)
          all_units = []
          per_year = {}
          for year in years:
              output = Path("phase1") / f"kra-phase1-{year}" / "output"
              dates = discover_result_dates(output, year, year, meets)
              units = build_result_units(year, year, meets, dates)
              per_year[str(year)] = len(units)
              all_units.extend(units)

          budgets = check_budget(all_units, used={"API227": 200}, safety_rate=0.10)
          report = {
              "years": list(years),
              "api227_units_by_year": per_year,
              "api227_units_total": len(all_units),
              "reserved_calls": 200,
              "budgets": [
                  {
                      "service": item.service,
                      "estimated_calls": item.estimated_calls,
                      "used_calls": item.used_calls,
                      "safety_margin": item.safety_margin,
                      "daily_limit": item.daily_limit,
                      "allowed": item.allowed,
                  }
                  for item in budgets
              ],
          }
          Path("api227-budget.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          assert budgets and all(item.allowed for item in budgets), report
          PY
      - name: Preserve quota decision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kra-api227-budget
          path: api227-budget.json
          if-no-files-found: error
          retention-days: 90

  phase2:
    needs: api227-budget
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [2016, 2017, 2018, 2019, 2022, 2023, 2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: kra-collection
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Find latest yearly state
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          YEAR: ${{ matrix.year }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          year = os.environ["YEAR"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "kra-api227-resume",
          }

          def artifacts(name):
              encoded = urllib.parse.quote(name)
              url = (
                  f"https://api.github.com/repos/{repository}/actions/artifacts"
                  f"?name={encoded}&per_page=100"
              )
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=headers)
              ) as response:
                  payload = json.load(response)
              return [
                  item for item in payload.get("artifacts", [])
                  if not item.get("expired")
              ]

          candidates = []
          for name in (f"kra-backfill-{year}", f"kra-phase1-{year}"):
              candidates.extend(artifacts(name))
          if not candidates:
              raise SystemExit(f"No resumable state found for {year}")
          selected = max(candidates, key=lambda item: item.get("created_at", ""))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"run_id={int(selected['workflow_run']['id'])}", file=output)
              print(f"artifact_name={selected['name']}", file=output)
          print(
              f"Resume from {selected['name']} artifact {selected['id']} "
              f"(run {selected['workflow_run']['id']}, created {selected['created_at']})"
          )
          PY

      - name: Restore latest yearly state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.previous.outputs.artifact_name }}
          path: restored
          run-id: ${{ steps.previous.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Restore output tree
        run: mv restored/output output

      - name: Sweep all pending API227 dates without fail-fast
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          YEAR: ${{ matrix.year }}
        run: |
          python -m kra_data.cli \
            --start-year "$YEAR" \
            --end-year "$YEAR" \
            --meets 1,2,3 \
            --endpoints race_record,results \
            --used-json '{}' \
            --request-timeout 30 \
            --request-attempts 1 \
            --continue-on-transient-error \
            --output output \
            > "phase2-${YEAR}.json"

      - name: Verify complete two-phase state from ledger
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path
          from kra_data.ledger import Ledger
          from kra_data.planning import build_result_units, discover_result_dates

          year = int(os.environ["YEAR"])
          output = Path("output")
          dates = discover_result_dates(output, year, year, (1, 2, 3))
          result_units = build_result_units(year, year, (1, 2, 3), dates)
          ledger = Ledger(output / "ledger.json")
          completed = ledger.completed()
          missing = [unit.key for unit in result_units if unit.key not in completed]
          failure_manifest = {
              "year": year,
              "planned": len(result_units),
              "complete": len(result_units) - len(missing),
              "incomplete": len(missing),
              "units": [
                  {
                      "key": key,
                      "state": ledger.state(key),
                      "error_type": ledger.data["units"].get(key, {}).get("error_type"),
                      "error": ledger.data["units"].get(key, {}).get("error"),
                  }
                  for key in missing
              ],
          }
          Path(f"api227-failures-{year}.json").write_text(
              json.dumps(failure_manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(failure_manifest, ensure_ascii=False, indent=2))
          assert result_units, "no API227 result units discovered"
          assert not missing, f"{len(missing)} API227 units remain incomplete; first={missing[:5]}"

          report_path = Path(f"phase2-{year}.json")
          if report_path.exists() and report_path.stat().st_size:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              assert report["results_deferred"] is False, report
              assert report["result_dates_discovered"] == len(result_units), report
              assert all(item["allowed"] for item in report.get("phase2_budget", [])), report
              print(json.dumps(report, ensure_ascii=False, indent=2))
          print(f"API227 ledger complete: {len(result_units)}/{len(result_units)} units for {year}")
          PY
          python -m kra_data.audit --output output

      - name: Preserve completed or partial yearly backfill
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kra-backfill-${{ matrix.year }}
          path: |
            output
            phase2-${{ matrix.year }}.json
            api227-failures-${{ matrix.year }}.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

# retriggered 2026-08-23 04:55 KST
name: Build 2016-2025 research dataset once

on:
  push:
    paths:
      - '.github/workflows/build-research-dataset-once.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: kra-research-dataset-once
  cancel-in-progress: true

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: src
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Restore 2016-2019 and 2022-2025 artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: kra-backfill-*
          path: restored/backfill
          run-id: 32544887677
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Restore 2020-2021 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kra-collection-state
          path: restored/pilot
          run-id: 32340684155
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Build integrated research bundle
        run: |
          python -m kra_data.research \
            --staged \
              restored/backfill/kra-backfill-2016/output/staged \
              restored/backfill/kra-backfill-2017/output/staged \
              restored/backfill/kra-backfill-2018/output/staged \
              restored/backfill/kra-backfill-2019/output/staged \
              restored/pilot/staged \
              restored/backfill/kra-backfill-2022/output/staged \
              restored/backfill/kra-backfill-2023/output/staged \
              restored/backfill/kra-backfill-2024/output/staged \
              restored/backfill/kra-backfill-2025/output/staged \
            --output research

      - name: Validate final bundle
        run: |
          python <<'PY'
          import gzip, json, pathlib
          p = pathlib.Path('research')
          m = json.loads((p / 'manifest.json').read_text(encoding='utf-8'))
          t = m['tables']
          expected = {
              'races': 24436,
              'race_record_rows': 261354,
              'entries_rows': 261392,
              'results_rows': 261354,
              'sales_rows': 163844,
              'odds_rows': 29192211,
              'nonrace_odds_rows': 526192,
              'coverage_rows': 24436,
          }
          assert t == expected, (t, expected)
          ids = []
          with gzip.open(p / 'races.jsonl.gz', 'rt', encoding='utf-8') as h:
              for line in h:
                  ids.append(json.loads(line)['race_id'])
          assert len(ids) == len(set(ids)) == 24436
          assert {int(x[:4]) for x in ids} == set(range(2016, 2026))
          print(json.dumps(m, ensure_ascii=False, indent=2))
          PY

      - name: Add checksums
        run: |
          cd research
          sha256sum races.jsonl.gz entries.jsonl.gz results.jsonl.gz sales.jsonl.gz odds.jsonl.gz coverage.jsonl.gz manifest.json > SHA256SUMS

      - name: Preserve research bundle as Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kra-research-2016-2025
          path: research
          retention-days: 90
          compression-level: 0

      - name: Upload research bundle to Dropbox
        run: |
          python <<'PY'
          import base64, json, os, pathlib, urllib.parse, urllib.request
          required = ('DROPBOX_APP_KEY','DROPBOX_APP_SECRET','DROPBOX_REFRESH_TOKEN')
          missing = [x for x in required if not os.environ.get(x)]
          if missing:
              raise SystemExit('Missing Dropbox secrets: ' + ', '.join(missing))
          credentials = base64.b64encode(f"{os.environ['DROPBOX_APP_KEY']}:{os.environ['DROPBOX_APP_SECRET']}".encode()).decode()
          req = urllib.request.Request(
              'https://api.dropboxapi.com/oauth2/token',
              data=urllib.parse.urlencode({'grant_type':'refresh_token','refresh_token':os.environ['DROPBOX_REFRESH_TOKEN']}).encode(),
              headers={'Authorization':f'Basic {credentials}'},
          )
          with urllib.request.urlopen(req) as response:
              token = json.load(response)['access_token']
          auth = {'Authorization': f'Bearer {token}'}
          def api(url, data, headers):
              with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=headers)) as response:
                  return json.load(response)
          def commit(path):
              return {'path': path, 'mode': 'overwrite', 'autorename': False, 'mute': True}
          def upload(source, destination):
              size = source.stat().st_size
              chunk_size = 8 * 1024 * 1024
              if size <= 140 * 1024 * 1024:
                  return api('https://content.dropboxapi.com/2/files/upload', source.read_bytes(), {
                      **auth, 'Content-Type':'application/octet-stream',
                      'Dropbox-API-Arg':json.dumps(commit(destination), ensure_ascii=True)})
              with source.open('rb') as h:
                  first = h.read(chunk_size)
                  started = api('https://content.dropboxapi.com/2/files/upload_session/start', first, {
                      **auth, 'Content-Type':'application/octet-stream',
                      'Dropbox-API-Arg':json.dumps({'close':False})})
                  sid = started['session_id']; offset = len(first)
                  while offset < size:
                      chunk = h.read(chunk_size); finishing = offset + len(chunk) == size
                      arg = {'cursor':{'session_id':sid,'offset':offset}}
                      endpoint = 'finish' if finishing else 'append_v2'
                      if finishing: arg['commit'] = commit(destination)
                      else: arg['close'] = False
                      result = api(f'https://content.dropboxapi.com/2/files/upload_session/{endpoint}', chunk, {
                          **auth, 'Content-Type':'application/octet-stream',
                          'Dropbox-API-Arg':json.dumps(arg, ensure_ascii=True)})
                      offset += len(chunk)
                  return result
          base = '/앱/kra-data/research/2016-2025'
          uploaded=[]
          for source in sorted(pathlib.Path('research').iterdir()):
              result=upload(source, f'{base}/{source.name}')
              uploaded.append({'name':source.name,'size':result.get('size',source.stat().st_size),'path':result.get('path_display')})
              print(json.dumps(uploaded[-1], ensure_ascii=False))
          pathlib.Path('dropbox-research-upload.json').write_text(json.dumps({'status':'success','uploaded':uploaded},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Preserve Dropbox upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kra-research-dropbox-evidence
          path: dropbox-research-upload.json
          if-no-files-found: warn
          retention-days: 90

name: Claude collected-data report review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'manifests/**'
      - 'reports/**'
      - 'evidence/**'

permissions: {}

concurrency:
  group: claude-data-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      review: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Review manifest and quality report with Claude Opus 5
        id: claude
        uses: anthropics/claude-code-action@c038e4dcdedfbbca18dfb17df35a17e40ded4ddc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          settings: |
            {"env":{"CLAUDE_CODE_MAX_OUTPUT_TOKENS":"24000"}}
          prompt: |
            You are Claude Opus 5 performing the single collected-data report review.
            Read only manifests/, reports/, evidence/, and DATA_LICENSE.md. Do not use
            the plan as proof that a check ran. Determine what the produced snapshot
            actually verifies, whether counts and statuses are internally consistent,
            whether any verification gate remains unrun, and whether the requested
            release grade is justified. A core_transport_verified report is not a
            full pilot pass. Do not edit, commit, push, comment, label, call MCP, or
            access the network. Return at most 8 root-cause findings.
          claude_args: >-
            --tools "Read,Grep,Glob"
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "mcp__*"
            --model claude-opus-5
            --max-turns 50
            --json-schema
            '{"type":"object","properties":{"needs_changes":{"type":"boolean"},"summary":{"type":"string"},"findings":{"type":"array","maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string"},"severity":{"type":"string","enum":["high","medium","low"]},"evidence":{"type":"string"},"recommendation":{"type":"string"}},"required":["id","severity","evidence","recommendation"],"additionalProperties":false}}},"required":["needs_changes","summary","findings"],"additionalProperties":false}'

  report:
    needs: review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Publish and enforce data review
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_JSON: ${{ needs.review.outputs.review }}
        with:
          script: |
            const ok = process.env.REVIEW_RESULT === 'success' && process.env.REVIEW_JSON;
            const lines = ['<!-- claude-data-review -->', '## Claude Opus 5 산출물 검토', '', `- 실행: ${process.env.REVIEW_RESULT}`, '- 자동 수정·병합: 수행하지 않음'];
            let blocking = !ok;
            if (ok) {
              const review = JSON.parse(process.env.REVIEW_JSON);
              lines.push('', `**판정:** ${review.needs_changes ? '수정 필요' : '통과'}`, '', review.summary || '');
              for (const f of review.findings || []) {
                lines.push('', `- **${f.severity.toUpperCase()} · ${f.id}**`);
                lines.push(`  - 근거: ${f.evidence}`);
                lines.push(`  - 권고: ${f.recommendation}`);
              }
              blocking = review.findings?.some((f) => f.severity === 'high') || false;
            }
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number, body: lines.join('\n')});
            if (blocking) core.setFailed('Claude data review failed or has HIGH findings.');

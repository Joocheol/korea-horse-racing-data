name: Verify corrected dataset on PR once

on:
  pull_request:
    paths:
      - '.verification-trigger'

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Report latest corrected rebuild and canonical Dropbox metadata
        run: |
          python <<'PY'
          import base64, json, os, urllib.parse, urllib.request

          repo = os.environ['REPOSITORY']
          gh_headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
          }
          def gh_get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=gh_headers)) as response:
                  return json.load(response)

          run_payload = gh_get(
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              'rebuild-research-corrected-once.yml/runs?branch=main&event=push&per_page=10'
          )
          runs = run_payload.get('workflow_runs', [])
          latest = runs[0] if runs else None
          artifacts = []
          if latest is not None:
              artifacts = gh_get(
                  f"https://api.github.com/repos/{repo}/actions/runs/{latest['id']}/artifacts?per_page=100"
              ).get('artifacts', [])

          credentials = base64.b64encode(
              f"{os.environ['DROPBOX_APP_KEY']}:{os.environ['DROPBOX_APP_SECRET']}".encode()
          ).decode()
          req = urllib.request.Request(
              'https://api.dropboxapi.com/oauth2/token',
              data=urllib.parse.urlencode({
                  'grant_type':'refresh_token',
                  'refresh_token':os.environ['DROPBOX_REFRESH_TOKEN'],
              }).encode(),
              headers={'Authorization':f'Basic {credentials}'},
          )
          with urllib.request.urlopen(req) as response:
              token = json.load(response)['access_token']
          dbx_auth = {'Authorization': f'Bearer {token}'}
          def rpc(endpoint, payload):
              req = urllib.request.Request(
                  f'https://api.dropboxapi.com/2/files/{endpoint}',
                  data=json.dumps(payload, ensure_ascii=True).encode(),
                  headers={**dbx_auth, 'Content-Type':'application/json'},
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          base = '/앱/kra-data/research/2016-2025'
          listing = rpc('list_folder', {'path':base, 'recursive':False})
          files = {
              e['name']: {'size':e.get('size'),'id':e.get('id'),'server_modified':e.get('server_modified')}
              for e in listing.get('entries', []) if e.get('.tag') == 'file'
          }
          report = {
              'latest_rebuild': None if latest is None else {
                  'id':latest['id'],'status':latest.get('status'),'conclusion':latest.get('conclusion'),
                  'head_sha':latest.get('head_sha'),'html_url':latest.get('html_url'),
                  'created_at':latest.get('created_at'),'updated_at':latest.get('updated_at'),
              },
              'artifacts': [
                  {'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),
                   'expired':a.get('expired'),'digest':a.get('digest')}
                  for a in artifacts
              ],
              'canonical_dropbox_files':files,
          }
          print('CORRECTED_DATASET_EVIDENCE_REPORT')
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          if latest is None:
              raise SystemExit('no corrected rebuild run found')
          PY

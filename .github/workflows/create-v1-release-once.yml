name: Clean up v1.0 release workflow once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/create-v1-release-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'Joocheol/korea-horse-racing-data'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify v1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_SHA: 1f0b8c743e33141c29dd54db2740acdfabc96f2b
        run: |
          set -euo pipefail
          release_sha="$(gh release view v1.0 --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq .targetCommitish)"
          test "${release_sha}" = "${EXPECTED_RELEASE_SHA}"
          python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          assert version == "1.0.0", version
          PY

      - name: Remove one-time workflow and release branches
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/create-v1-release-once.yml
          git commit -m "Remove one-time v1.0 release workflow"
          git push origin HEAD:main
          for branch in release/v1.0 cleanup/v1-release-workflow; do
            git push origin --delete "${branch}" || true
          done

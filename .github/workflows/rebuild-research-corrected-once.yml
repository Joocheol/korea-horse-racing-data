name: Rebuild corrected 2016-2025 research dataset once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-research-corrected-once.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: kra-research-corrected-once
  cancel-in-progress: true

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: src
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Restore 2016-2019 and 2022-2025 artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: kra-backfill-*
          path: restored/backfill
          run-id: 32544887677
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Restore 2020-2021 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kra-collection-state
          path: restored/pilot
          run-id: 32340684155
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Build corrected integrated research bundle
        run: |
          python -m kra_data.research \
            --staged \
              restored/backfill/kra-backfill-2016/output/staged \
              restored/backfill/kra-backfill-2017/output/staged \
              restored/backfill/kra-backfill-2018/output/staged \
              restored/backfill/kra-backfill-2019/output/staged \
              restored/pilot/staged \
              restored/backfill/kra-backfill-2022/output/staged \
              restored/backfill/kra-backfill-2023/output/staged \
              restored/backfill/kra-backfill-2024/output/staged \
              restored/backfill/kra-backfill-2025/output/staged \
            --output research

      - name: Validate corrected bundle
        run: |
          python <<'PY'
          import gzip, json, pathlib
          p = pathlib.Path('research')
          m = json.loads((p / 'manifest.json').read_text(encoding='utf-8'))
          t = m['tables']
          expected = {
              'races': 24436,
              'race_record_rows': 261354,
              'entries_rows': 261354,
              'entries_source_duplicate_rows_removed': 38,
              'entries_source_conflicting_duplicate_keys': 38,
              'results_rows': 261354,
              'sales_rows': 163844,
              'odds_rows': 29192211,
              'nonrace_odds_rows': 526192,
              'coverage_rows': 24436,
          }
          assert t == expected, (t, expected)
          race_ids = []
          with gzip.open(p / 'races.jsonl.gz', 'rt', encoding='utf-8') as h:
              for line in h:
                  race_ids.append(json.loads(line)['race_id'])
          assert len(race_ids) == len(set(race_ids)) == 24436
          assert {int(x[:4]) for x in race_ids} == set(range(2016, 2026))
          entry_keys = set(); entry_rows = 0
          with gzip.open(p / 'entries.jsonl.gz', 'rt', encoding='utf-8') as h:
              for line in h:
                  row = json.loads(line); entry_rows += 1
                  key = (row['race_id'], int(row['chulNo']), str(row['hrNo']))
                  assert key not in entry_keys, key
                  entry_keys.add(key)
          assert entry_rows == len(entry_keys) == 261354
          print(json.dumps(m, ensure_ascii=False, indent=2))
          PY

      - name: Add checksums
        run: |
          cd research
          sha256sum races.jsonl.gz entries.jsonl.gz results.jsonl.gz sales.jsonl.gz odds.jsonl.gz coverage.jsonl.gz manifest.json > SHA256SUMS

      - name: Preserve corrected research bundle as Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kra-research-2016-2025-corrected
          path: research
          retention-days: 90
          compression-level: 0

      - name: Stage, verify, and promote corrected bundle in canonical Dropbox
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          python <<'PY'
          import base64, json, os, pathlib, urllib.parse, urllib.request, urllib.error

          required = ('DROPBOX_APP_KEY','DROPBOX_APP_SECRET','DROPBOX_REFRESH_TOKEN')
          missing = [x for x in required if not os.environ.get(x)]
          if missing:
              raise SystemExit('Missing Dropbox secrets: ' + ', '.join(missing))

          credentials = base64.b64encode(
              f"{os.environ['DROPBOX_APP_KEY']}:{os.environ['DROPBOX_APP_SECRET']}".encode()
          ).decode()
          token_req = urllib.request.Request(
              'https://api.dropboxapi.com/oauth2/token',
              data=urllib.parse.urlencode({
                  'grant_type':'refresh_token',
                  'refresh_token':os.environ['DROPBOX_REFRESH_TOKEN'],
              }).encode(),
              headers={'Authorization':f'Basic {credentials}'},
          )
          with urllib.request.urlopen(token_req) as response:
              token = json.load(response)['access_token']
          auth = {'Authorization': f'Bearer {token}'}

          def content_api(url, data, headers):
              with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=headers)) as response:
                  return json.load(response)

          def rpc(endpoint, payload):
              req = urllib.request.Request(
                  f'https://api.dropboxapi.com/2/files/{endpoint}',
                  data=json.dumps(payload, ensure_ascii=True).encode(),
                  headers={**auth, 'Content-Type':'application/json'},
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def commit(path):
              return {'path': path, 'mode': 'overwrite', 'autorename': False, 'mute': True}

          def upload(source, destination):
              size = source.stat().st_size
              chunk_size = 8 * 1024 * 1024
              if size <= 140 * 1024 * 1024:
                  return content_api(
                      'https://content.dropboxapi.com/2/files/upload',
                      source.read_bytes(),
                      {**auth, 'Content-Type':'application/octet-stream',
                       'Dropbox-API-Arg':json.dumps(commit(destination), ensure_ascii=True)},
                  )
              with source.open('rb') as h:
                  first = h.read(chunk_size)
                  started = content_api(
                      'https://content.dropboxapi.com/2/files/upload_session/start', first,
                      {**auth, 'Content-Type':'application/octet-stream',
                       'Dropbox-API-Arg':json.dumps({'close':False})},
                  )
                  sid = started['session_id']; offset = len(first)
                  while offset < size:
                      chunk = h.read(chunk_size)
                      finishing = offset + len(chunk) == size
                      arg = {'cursor':{'session_id':sid,'offset':offset}}
                      endpoint = 'finish' if finishing else 'append_v2'
                      if finishing: arg['commit'] = commit(destination)
                      else: arg['close'] = False
                      result = content_api(
                          f'https://content.dropboxapi.com/2/files/upload_session/{endpoint}', chunk,
                          {**auth, 'Content-Type':'application/octet-stream',
                           'Dropbox-API-Arg':json.dumps(arg, ensure_ascii=True)},
                      )
                      offset += len(chunk)
                  return result

          run_id = os.environ['GITHUB_RUN_ID_VALUE']
          canonical = '/앱/kra-data/research/2016-2025'
          staging = f'/앱/kra-data/research/.staging-2016-2025-{run_id}'
          backup = f'/앱/kra-data/research/.backup-2016-2025-{run_id}'
          local = pathlib.Path('research')
          expected = {p.name: p.stat().st_size for p in local.iterdir() if p.is_file()}
          uploaded = []

          for source in sorted(local.iterdir()):
              if not source.is_file():
                  continue
              result = upload(source, f'{staging}/{source.name}')
              uploaded.append({
                  'name': source.name,
                  'size': result.get('size', source.stat().st_size),
                  'path': result.get('path_display'),
              })
              print(json.dumps(uploaded[-1], ensure_ascii=False))

          listing = rpc('list_folder', {'path': staging, 'recursive': False})
          remote = {e['name']: e.get('size') for e in listing.get('entries', []) if e.get('.tag') == 'file'}
          assert remote == expected, (remote, expected)

          promotion = {'canonical': canonical, 'staging': staging, 'backup': backup, 'old_moved': False,
                       'new_promoted': False, 'rollback': None, 'backup_cleanup': None}
          rpc('move_v2', {'from_path': canonical, 'to_path': backup, 'autorename': False})
          promotion['old_moved'] = True
          try:
              rpc('move_v2', {'from_path': staging, 'to_path': canonical, 'autorename': False})
              promotion['new_promoted'] = True
          except Exception as promote_error:
              try:
                  rpc('move_v2', {'from_path': backup, 'to_path': canonical, 'autorename': False})
                  promotion['rollback'] = 'success'
              except Exception as rollback_error:
                  promotion['rollback'] = f'failed: {rollback_error}'
              raise RuntimeError(f'promotion failed; rollback={promotion["rollback"]}') from promote_error

          try:
              rpc('delete_v2', {'path': backup})
              promotion['backup_cleanup'] = 'success'
          except Exception as cleanup_error:
              promotion['backup_cleanup'] = f'warning: {cleanup_error}'

          evidence = {'status':'success', 'uploaded':uploaded, 'verified_sizes':remote, 'promotion':promotion}
          pathlib.Path('dropbox-research-upload-corrected.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2)+'\n', encoding='utf-8'
          )
          print(json.dumps(promotion, ensure_ascii=False, indent=2))
          PY

      - name: Preserve corrected Dropbox upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kra-research-dropbox-evidence-corrected
          path: dropbox-research-upload-corrected.json
          if-no-files-found: warn
          retention-days: 90

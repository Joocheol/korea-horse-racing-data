name: Audit KRA provider corrections

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kra-provider-correction-audit
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: kra-collection
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test correction audit logic
        run: python -m unittest tests.test_provider_recheck -v
      - name: Recheck 11 targeted API requests
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: >-
          python -m kra_data.provider_recheck
          --output output/provider-correction-audit
      - name: Preserve correction evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kra-provider-correction-audit
          path: output/provider-correction-audit
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

name: Resume full KRA 2020-2021 pilot once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/resume-full-pilot-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: kra-pilot-collection
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: kra-collection
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Restore preserved partial state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kra-collection-state
          path: output
          run-id: 32329756491
          github-token: ${{ github.token }}
      - name: Resume remaining 179 units
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: >-
          python -m kra_data.cli
          --start-year 2020
          --end-year 2021
          --meets "1,2,3"
          --endpoints "single,double,triple,sales,entries,results,race_record,quinella_crosscheck"
          --max-units 179
          --used-json '{"API227":2057,"API29_1":204,"API26_2":68,"API5":67,"API4_3":67,"API179_1":68,"API28_1":68,"API30_1":144}'
          --output output
      - name: Recompute checksums and technical completeness
        run: python -m kra_data.audit --output output
      - name: Preserve resumed state
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kra-collection-state
          path: output
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

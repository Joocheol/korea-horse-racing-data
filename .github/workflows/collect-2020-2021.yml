name: Collect KRA data with approval and resume

on:
  workflow_dispatch:
    inputs:
      start:
        description: First month (YYYY-MM)
        required: true
        default: '2020-01'
      end:
        description: Last month (YYYY-MM)
        required: true
        default: '2021-12'
      meets:
        description: Comma-separated meet codes
        required: true
        default: '1,2,3'
      endpoints:
        description: Comma-separated registry IDs
        required: true
        default: 'api28,api29,api30,api179'
      page_size:
        description: Requested rows per page
        required: true
        default: '100000'
      snapshot_id:
        description: Stable 1-80 character ID reused for resume
        required: true

permissions: {}

concurrency:
  group: collect-kra-${{ inputs.snapshot_id }}
  cancel-in-progress: false

jobs:
  collect-verify-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    environment: kra-collection
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      DATA_GO_KR_KEY_ID: data-go-kr-service-key
      SNAPSHOT_ID: ${{ inputs.snapshot_id }}
      OUTPUT_ROOT: artifacts/kra-collection
      ARTIFACT_NAME: kra-${{ inputs.snapshot_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Validate dispatch inputs
        run: |
          python - <<'PY'
          import os, re
          value = os.environ["SNAPSHOT_ID"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,79}", value):
              raise SystemExit("invalid snapshot_id")
          PY

      - name: Restore the newest partial artifact for this snapshot
        run: |
          mkdir -p "$OUTPUT_ROOT"
          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
              --jq '.artifacts | map(select(.expired | not)) | sort_by(.created_at) | last | .id // empty'
          )"
          if [ -n "$artifact_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/kra-resume.zip
            unzip -oq /tmp/kra-resume.zip -d "$OUTPUT_ROOT"
            echo "restored_artifact_id=$artifact_id"
          else
            echo "no_prior_artifact=true"
          fi

      - name: Build zero-cost request plan
        run: >-
          PYTHONPATH=src python -m kra_collector
          --start "${{ inputs.start }}" --end "${{ inputs.end }}"
          --meets "${{ inputs.meets }}"
          --endpoints "${{ inputs.endpoints }}"
          --page-size "${{ inputs.page_size }}"
          --plan-output "$OUTPUT_ROOT/preflight/request-plan.json"
          --dry-run

      - name: Probe credential, endpoint approval, and quota budget
        run: >-
          PYTHONPATH=src python -m kra_collector.preflight
          --start "${{ inputs.start }}" --end "${{ inputs.end }}"
          --meets "${{ inputs.meets }}"
          --endpoints "${{ inputs.endpoints }}"
          --page-size "${{ inputs.page_size }}"
          --output "$OUTPUT_ROOT/preflight/preflight.json"

      - name: Collect or resume the snapshot
        id: collect
        run: |
          set +e
          PYTHONPATH=src python -m kra_collector \
            --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            --meets "${{ inputs.meets }}" \
            --endpoints "${{ inputs.endpoints }}" \
            --page-size "${{ inputs.page_size }}" \
            --snapshot-id "$SNAPSHOT_ID" \
            --output "$OUTPUT_ROOT"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify raw pages, terminal probes, normalized rows, and hashes
        id: verify
        run: |
          set +e
          PYTHONPATH=src python -m kra_collector.verify \
            --root "$OUTPUT_ROOT" --snapshot-id "$SNAPSHOT_ID" \
            --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            --meets "${{ inputs.meets }}" \
            --endpoints "${{ inputs.endpoints }}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Scan all artifacts for raw and encoded secret variants
        id: secret_scan
        run: PYTHONPATH=src python -m kra_collector.scan --root "$OUTPUT_ROOT"

      - name: Upload resumable snapshot even when collection is incomplete
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: kra-${{ inputs.snapshot_id }}
          path: artifacts/kra-collection
          if-no-files-found: error
          retention-days: 90

      - name: Open a baseline PR with license-safe manifests and reports
        if: steps.collect.outputs.exit_code == '0' && steps.verify.outputs.exit_code == '0' && github.ref_name == 'main'
        env:
          BASE_BRANCH: main
        run: |
          branch="data/snapshot-${SNAPSHOT_ID}-${GITHUB_RUN_ID}"
          base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_BRANCH}" --jq .object.sha)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${branch}" -f sha="$base_sha"

          put_file() {
            local repository_path="$1"
            local source_path="$2"
            local encoded existing_sha
            encoded="$(base64 -w0 "$source_path")"
            existing_sha="$(
              gh api "repos/${GITHUB_REPOSITORY}/contents/${repository_path}?ref=${branch}" \
                --jq '.sha' 2>/dev/null || true
            )"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${repository_path}"
                  -f message="Record verified KRA snapshot ${SNAPSHOT_ID}"
                  -f content="$encoded" -f branch="$branch")
            if [ -n "$existing_sha" ]; then args+=(-f sha="$existing_sha"); fi
            gh api "${args[@]}" >/dev/null
          }

          put_file "manifests/manifest-${SNAPSHOT_ID}.jsonl" \
            "$OUTPUT_ROOT/manifests/manifest-${SNAPSHOT_ID}.jsonl"
          put_file "reports/quality-${SNAPSHOT_ID}.json" \
            "$OUTPUT_ROOT/reports/quality-${SNAPSHOT_ID}.json"
          put_file "reports/preflight-${SNAPSHOT_ID}.json" \
            "$OUTPUT_ROOT/preflight/preflight.json"

          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "Record verified KRA snapshot ${SNAPSHOT_ID}" \
            --body "Verified transport-level manifest and quality report. Raw responses remain outside Git pending the data-license gate. Full pilot promotion remains false until the quality report's unrun gates are completed."

      - name: Enforce collection and verification result
        if: always()
        run: |
          test "${{ steps.collect.outputs.exit_code }}" = "0"
          test "${{ steps.verify.outputs.exit_code }}" = "0"
          test "${{ steps.secret_scan.outcome }}" = "success"

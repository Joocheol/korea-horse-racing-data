name: Collect KRA 2020-2021 core data

on:
  workflow_dispatch:
  push:
    branches: [agent/initial-collection-plan]
    paths:
      - 'src/kra_collector/**'
      - 'tests/test_collector.py'
      - 'requirements.txt'
      - '.github/workflows/collect-2020-2021.yml'

permissions:
  contents: read

concurrency:
  group: collect-kra-2020-2021-core
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=src pytest -q
      - run: PYTHONPATH=src python -m kra_collector --dry-run

  collect:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY || secrets.KRA_SERVICE_KEY || secrets.KRA_API_KEY || secrets.DATA_GO_KR_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Collect monthly core endpoints
        run: >-
          PYTHONPATH=src python -m kra_collector
          --start 2020-01 --end 2021-12
          --meets 1,2,3
          --endpoints api28,api29,api30,api179
          --page-size 100000
          --snapshot-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --output artifacts/kra-2020-2021-core
      - name: Upload raw responses, normalized rows, and manifest
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: kra-2020-2021-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/kra-2020-2021-core
          if-no-files-found: warn
          retention-days: 30

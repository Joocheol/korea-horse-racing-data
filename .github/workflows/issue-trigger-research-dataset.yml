name: Trigger research dataset from issue

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.title == '[automation] build research dataset'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch research dataset workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-research-dataset-once.yml --repo ${{ github.repository }} --ref main

name: API227 one-time isolation diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api227-diagnostic-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: kra-collection
    env:
      PYTHONPATH: src
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Control probe API30
        run: >-
          python -m kra_data.probe
          --endpoint triple
          --meet 1
          --month 202512
          --pool TRI
          --page-no 1
          --num-rows 10
          --timeout 30
          --max-attempts 1
      - name: Target probe API227
        run: >-
          python -m kra_data.probe
          --endpoint results
          --meet 1
          --month 202512
          --race-date 20251207
          --race-no 1
          --page-no 1
          --num-rows 10
          --timeout 30
          --max-attempts 1

name: Collector CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Immutable snapshot PR head SHA to test
        required: true
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
      - 'config/**'
      - 'evidence/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: collector-ci-${{ github.event.pull_request.number || inputs.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=src python -m compileall -q src tests
      - run: PYTHONPATH=src pytest -q
      - run: >-
          PYTHONPATH=src python -m kra_collector
          --start 2020-01 --end 2021-12
          --meets 1,2,3
          --endpoints api28,api29,api30,api179
          --page-size 100000
          --plan-output /tmp/kra-request-plan.json
          --dry-run
      - run: test -s /tmp/kra-request-plan.json
      - name: Publish explicit snapshot CI status
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TARGET_SHA: ${{ inputs.head_sha }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const passed = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: passed ? 'success' : 'failure',
              context: 'Collector CI',
              description: passed ? 'Collector CI passed' : 'Collector CI failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!passed) core.setFailed('Collector CI failed.');

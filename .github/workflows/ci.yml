name: Collector CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
      - 'config/**'
      - 'evidence/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
      - 'config/**'
      - 'evidence/**'

permissions:
  contents: read

concurrency:
  group: collector-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=src python -m compileall -q src tests
      - run: PYTHONPATH=src pytest -q
      - run: >-
          PYTHONPATH=src python -m kra_collector
          --start 2020-01 --end 2021-12
          --meets 1,2,3
          --endpoints api28,api29,api30,api179
          --page-size 100000
          --plan-output /tmp/kra-request-plan.json
          --dry-run
      - run: test -s /tmp/kra-request-plan.json

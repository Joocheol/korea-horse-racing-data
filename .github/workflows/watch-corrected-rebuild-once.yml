# retrigger via merge push 2026-08-23 08:00 KST
name: Watch corrected research rebuild once

on:
  workflow_run:
    workflows: ['Rebuild corrected 2016-2025 research dataset once']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/watch-corrected-rebuild-once.yml'

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve corrected rebuild result and report on PR 30
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_URL: ${{ github.event.workflow_run.html_url }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python <<'PY'
          import json, os, time, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  return json.load(response)

          if os.environ['EVENT_NAME'] == 'workflow_run' and os.environ.get('EVENT_RUN_ID'):
              run = {
                  'id': int(os.environ['EVENT_RUN_ID']),
                  'conclusion': os.environ['EVENT_CONCLUSION'],
                  'head_sha': os.environ['EVENT_HEAD_SHA'],
                  'html_url': os.environ['EVENT_RUN_URL'],
                  'status': 'completed',
              }
          else:
              endpoint = (
                  f'https://api.github.com/repos/{repo}/actions/workflows/'
                  'rebuild-research-corrected-once.yml/runs?branch=main&event=push&per_page=10'
              )
              run = None
              for _ in range(60):
                  payload = get_json(endpoint)
                  runs = payload.get('workflow_runs', [])
                  if runs:
                      latest = runs[0]
                      if latest.get('status') == 'completed':
                          run = latest
                          break
                  time.sleep(10)
              if run is None:
                  raise SystemExit('latest corrected rebuild did not complete within watcher window')

          body = (
              f"Corrected research rebuild completed: conclusion={run.get('conclusion')}; "
              f"run_id={run['id']}; head_sha={run.get('head_sha')}; "
              f"run={run.get('html_url')}"
          )
          url = f'https://api.github.com/repos/{repo}/issues/30/comments'
          req = urllib.request.Request(
              url,
              data=json.dumps({'body': body}).encode(),
              headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(req) as response:
              print(response.status)
          print(body)
          PY

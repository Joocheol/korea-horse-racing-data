name: Trigger research dataset build once

on:
  push:
    paths:
      - 'docs/RESEARCH_BUILD_TRIGGER.txt'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch research dataset workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-research-dataset-once.yml --repo ${{ github.repository }} --ref main
